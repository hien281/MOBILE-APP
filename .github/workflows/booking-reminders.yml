name: Send SPORTY booking reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected Vercel endpoint
        env:
          SPORTY_API_URL: ${{ secrets.SPORTY_API_URL }}
          SPORTY_CRON_SECRET: ${{ secrets.SPORTY_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 90 \
            --retry 2 \
            -H "Authorization: Bearer ${SPORTY_CRON_SECRET}" \
            "${SPORTY_API_URL%/}/internal/send-booking-reminders"
