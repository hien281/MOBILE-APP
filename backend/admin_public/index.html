<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SPORTY Admin</title><style>
:root{--navy:#1E147B;--violet:#C86FC9;--lav:#DFDCF9;--cream:#F6F7EB;--yellow:#FFEE82;--ink:#241d4b;--muted:#78748d;--line:#e7e5f1}*{box-sizing:border-box}body{margin:0;font:14px system-ui,'Segoe UI',sans-serif;color:var(--ink);background:var(--cream)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}#signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#1E147B,#7959b7)}.login{width:min(440px,100%);border-radius:24px;background:white;padding:36px;box-shadow:0 20px 70px #0003}.login h1{font-size:25px;color:var(--navy);margin:0}.login p{color:var(--muted);line-height:1.6}.login input{width:100%;margin:7px 0;padding:13px;border:1px solid var(--line);border-radius:11px}.btn{border:0;padding:11px 17px;border-radius:11px;background:var(--navy);color:white;font-weight:650}.btn.alt{background:var(--lav);color:var(--navy)}.btn.yellow{background:var(--yellow);color:var(--navy)}.login .btn{width:100%;margin-top:12px}.hidden{display:none!important}#app{display:flex;min-height:100vh}aside{width:245px;background:var(--navy);color:white;padding:27px 16px;flex-shrink:0}aside h2{font-size:22px;margin:4px 15px 40px;letter-spacing:1px}aside h2 span{color:var(--yellow)}.nav{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:14px;color:#ede8ff;background:transparent;margin:7px 0}.nav.active{background:#fff2;color:var(--yellow);font-weight:750}.sidefoot{font-size:12px;color:#c3b9ef;line-height:1.7;margin:42px 13px}main{flex:1;min-width:0;padding:30px clamp(16px,3vw,44px)}header{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}header h1{margin:0;color:var(--navy);font-size:25px}header p{margin:6px 0 0;color:var(--muted)}.content{margin-top:25px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 14px #1e147b05}.card label{display:block;color:var(--muted);font-size:12px}.card strong{font-size:27px;color:var(--navy);display:block;margin-top:9px}.panel{margin-top:18px}.panel h3{margin:0 0 20px;color:var(--navy);font-size:16px}.bars{display:flex;align-items:end;height:165px;gap:12px;border-bottom:1px solid var(--line);padding:5px 5px 0}.bar{flex:1;min-width:7px;max-width:70px;background:linear-gradient(var(--violet),var(--navy));border-radius:7px 7px 0 0;position:relative}.bar::before{content:attr(data-count);position:absolute;bottom:calc(100% + 6px);left:0;right:0;text-align:center;color:var(--navy);font-size:12px;font-weight:750;pointer-events:none}.bar:hover{filter:brightness(1.1)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:12px}.toolbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.search{border:1px solid var(--line);border-radius:10px;padding:11px;min-width:245px;max-width:100%;background:white}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:13px 11px;font-size:12px;vertical-align:top}th{color:var(--muted);font-size:11px;letter-spacing:.3px}td b{color:var(--navy)}.pill{border-radius:100px;padding:5px 10px;background:#e5f4e9;color:#167246;display:inline-block}.pill.warn{background:#fff3d2;color:#975f16}.pill.gray{background:#eee;color:#555}.small{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#17113888;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.dialog{background:white;width:min(700px,100%);border-radius:20px;padding:27px;max-height:92vh;overflow:auto}.dialog h2{color:var(--navy);margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:12px;font-weight:600}.formgrid input,.formgrid select,.formgrid textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px}.wide{grid-column:span 2}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:14px 18px;border-radius:10px;box-shadow:0 5px 30px #0003;z-index:20} @media(max-width:850px){aside{width:68px;padding:15px 6px}aside h2{font-size:11px;margin:15px 4px}aside h2 span{display:none}.nav{font-size:11px;padding:12px 4px;text-align:center}.sidefoot{display:none}.cards{grid-template-columns:repeat(2,1fr)}main{padding:18px}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.card{padding:14px}.card strong{font-size:21px}}
.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.analytics-grid .panel{margin-top:0;min-width:0}.rank{display:flex;gap:8px;align-items:center;margin:12px 0}.rank-name{width:43%;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank-track{flex:1;background:#eeeafb;border-radius:8px;height:14px;overflow:hidden}.rank-fill{height:100%;background:linear-gradient(90deg,#1e147b,#c86fc9);border-radius:8px}.rank-value{font-size:11px;min-width:80px;text-align:right;font-weight:700;color:var(--navy)}.editpanel{background:white;border-radius:17px;border:1px solid var(--line);padding:22px;margin:15px 0}.editpanel .formgrid textarea{min-height:70px}.editpanel h3{color:var(--navy)}@media(max-width:1000px){.analytics-grid{grid-template-columns:1fr}}@media(max-width:680px){.formgrid{grid-template-columns:1fr}.wide{grid-column:span 1}}
.subtabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}.subtab{background:white;color:var(--navy);border:1px solid var(--line);padding:11px 17px;border-radius:12px;font-weight:650}.subtab.active{background:var(--navy);color:white;border-color:var(--navy)}.report-month-chart{display:flex;align-items:end;gap:12px;min-height:225px;overflow-x:auto;padding:20px 0 2px}.report-month{flex:1;min-width:65px;text-align:center;font-size:11px;color:var(--muted)}.report-bars{display:flex;align-items:end;justify-content:center;gap:5px;height:185px;border-bottom:1px solid var(--line);margin-bottom:8px}.report-col{width:26px;max-width:40%;border-radius:6px 6px 0 0;min-height:3px}.report-booking{background:var(--navy)}.report-member{background:var(--violet)}.report-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:12px}.report-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.report-donut{width:min(210px,100%);aspect-ratio:1;border-radius:50%;margin:18px auto;display:grid;place-items:center}.report-donut>div{width:68%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:9px}.report-donut strong{font-size:16px;color:var(--navy)}.report-donut span{font-size:11px;color:var(--muted)}.report-breakdown>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}.report-breakdown b{color:var(--navy);text-align:right}</style></head><body>
<section id="signin"><div class="login"><h1>SPORTY <span style="color:#C86FC9">ADMIN</span></h1><p>Đăng nhập bằng tài khoản Firebase đã được cấp quyền quản trị.</p><form id="loginform"><input id="email" type="email" placeholder="Email admin" required autocomplete="username"><input id="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password"><button class="btn" type="submit">Đăng nhập</button></form><p id="loginError" style="color:#b42332"></p></div></section>
<div id="app" class="hidden"><aside><h2>SPORTY<span> ADMIN</span></h2><button class="nav active" data-view="dashboard">▦ &nbsp; Tổng quan</button><button class="nav" data-view="bookings">▤ &nbsp; Đơn đặt sân</button><button class="nav" data-view="fields">▣ &nbsp; Quản lý sân</button><button class="nav" data-view="memberships">◇ &nbsp; Gói hội viên</button><button class="nav" data-view="events">▤ &nbsp; Tin tức & sự kiện</button><div class="sidefoot" style="margin:22px 13px 6px">VẬN HÀNH</div><button class="nav" data-view="calendar">▦ &nbsp; Lịch sân</button><button class="nav" data-view="payments">◈ &nbsp; Thanh toán & hoàn tiền</button><button class="nav" data-view="customers">♙ &nbsp; Khách hàng</button><button class="nav" data-view="cards">◇ &nbsp; Thẻ hội viên đã mua</button><button class="nav" data-view="reports">▥ &nbsp; Báo cáo</button><div class="sidefoot" style="margin:22px 13px 6px">HỆ THỐNG</div><button class="nav" data-view="admins">♧ &nbsp; Phân quyền Admin</button><button class="nav" data-view="audit">◷ &nbsp; Nhật ký hoạt động</button><button class="nav" data-view="settings">⚙ &nbsp; Cài đặt</button><div class="sidefoot">Admin MVP<br>Firebase • Express • Vercel</div></aside><main><header><div><h1 id="heading">Tổng quan</h1><p id="subtitle">Hoạt động SPORTY từ dữ liệu Firestore</p></div><div style="display:flex;gap:8px"><button id="refresh" class="btn alt">↻ Làm mới</button><button id="logout" class="btn alt">Đăng xuất</button></div></header><div id="content" class="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="dialog"><h2 id="modalTitle">Thông tin sân</h2><form id="fieldForm"><input type="hidden" name="id"><div class="formgrid">
<label class="wide">Tên cơ sở<input name="name" maxlength="150" required></label>
<label class="wide">Địa chỉ<input name="address" maxlength="350" required></label>
<label>Bộ môn<select name="sport"><option>Bóng đá</option><option>Cầu lông</option><option>Tennis</option><option>Pickleball</option></select></label>
<label>Giá / giờ (VND)<input name="price" type="number" min="0" max="100000000" step="1000" required></label>
<label>Số sân con<input name="courtCount" type="number" min="1" max="100" required></label>
<label>Đánh giá (0–5)<input name="rating" type="number" min="0" max="5" step="0.1" required></label>
<label>Giờ mở cửa<input name="openingTime" type="time" step="3600" required></label>
<label>Giờ đóng cửa<input name="closingTime" type="time" step="3600" required></label>
<label class="wide">Ảnh đại diện (URL HTTPS)<input name="imageUrl" type="url" placeholder="https://..." required></label>
<label class="wide">Ảnh bổ sung (mỗi dòng một URL HTTPS)<textarea name="images" rows="3" placeholder="https://..."></textarea></label>
<label>Vĩ độ (latitude)<input name="latitude" type="number" min="-90" max="90" step="any" placeholder="10.78"></label>
<label>Kinh độ (longitude)<input name="longitude" type="number" min="-180" max="180" step="any" placeholder="106.69"></label>
<label>Số điện thoại<input name="phone" type="tel" maxlength="40"></label>
<label>Google Maps URL<input name="googleMapsUrl" type="url" placeholder="https://..."></label>
<label class="wide">Tiện ích (mỗi dòng một tiện ích)<textarea name="facilities" rows="3" placeholder="Bãi đỗ xe&#10;Phòng thay đồ"></textarea></label>
<label><input type="checkbox" name="isPopular"> Sân nổi bật</label>
<label><input type="checkbox" name="isActive" checked> Đang hoạt động</label>
</div><div class="actions"><button type="button" id="closeModal" class="btn alt">Huỷ</button><button type="submit" class="btn">Lưu thay đổi</button></div></form></div></div><div id="toast" class="hidden"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebase=initializeApp({apiKey:'AIzaSyC6SeOH9Y4Fmm7RU_e9T68JVK4uzHbjZ4U',authDomain:'sport-app-b6ba9.firebaseapp.com',projectId:'sport-app-b6ba9',appId:'1:499981685398:web:532fafbd96ef0abee628b7'});
const auth=getAuth(firebase), el=id=>document.getElementById(id);let view='dashboard',bookings=[],fields=[];
const escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ';
function toast(msg){el('toast').textContent=msg;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),4000)}
async function api(url,opt={}){const token=await auth.currentUser?.getIdToken();if(!token)throw Error('Bạn chưa đăng nhập');const r=await fetch('/api/admin'+url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Lỗi kết nối');return j}
async function access(){await api('/overview');el('signin').classList.add('hidden');el('app').classList.remove('hidden');await render();}
onAuthStateChanged(auth,async u=>{if(!u){el('app').classList.add('hidden');el('signin').classList.remove('hidden');return}try{await access()}catch(e){el('loginError').textContent=e.message;await signOut(auth)}});
el('loginform').onsubmit=async e=>{e.preventDefault();el('loginError').textContent='';try{await signInWithEmailAndPassword(auth,el('email').value,el('password').value)}catch(err){el('loginError').textContent='Sai tài khoản, mật khẩu hoặc phương thức đăng nhập chưa bật.'}};
el('logout').onclick=()=>signOut(auth);el('refresh').onclick=()=>render();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
async function render(){const labels={dashboard:['Tổng quan','Hiệu suất SPORTY từ Firestore'],bookings:['Đơn đặt sân','Lịch sử khách hàng và các buổi đặt'],fields:['Quản lý sân','Thêm, cập nhật giờ hoạt động và giá sân'],memberships:['Gói hội viên','Tạo gói, chỉnh sửa và theo dõi lượt mua'],events:['Tin tức & sự kiện','Đăng và quản lý nội dung Khám phá'],calendar:['Lịch sân','Theo dõi lịch theo ngày và từng sân'],payments:['Thanh toán & hoàn tiền','Theo dõi giao dịch và yêu cầu hoàn tiền'],customers:['Khách hàng','Lịch sử đặt và tổng chi tiêu'],cards:['Thẻ hội viên đã mua','Quản lý thẻ và số lượt còn lại'],reports:['Báo cáo','Doanh thu theo tháng'],admins:['Phân quyền Admin','Kiểm tra danh sách được cấp quyền'],audit:['Nhật ký hoạt động','Theo dõi chỉnh sửa dữ liệu'],settings:['Cài đặt','Tổng quan vận hành và cấu hình']};el('heading').textContent=labels[view][0];el('subtitle').textContent=labels[view][1];el('content').innerHTML='<div class="panel">Đang tải dữ liệu...</div>';try{if(view==='dashboard')await dashboard();else if(view==='bookings')await bookingView();else if(view==='fields')await fieldView();else if(view==='memberships')await membershipView();else if(view==='events')await eventView();else if(view==='calendar')await calendarView();else if(view==='payments')await paymentsView();else if(view==='customers')await customerView();else if(view==='cards')await cardsView();else if(view==='reports')await reportsView();else if(view==='admins')await adminsView();else if(view==='audit')await auditView();else await settingsView()}catch(e){el('content').innerHTML='<div class="panel">'+escapeHTML(e.message)+'</div>'}}
const ranking=(data,key,fmt)=>{const max=Math.max(1,...data.map(x=>Number(x[key])||0));return data.length?data.map((x,i)=>'<div class="rank"><div class="rank-name" title="'+escapeHTML(x.name)+'">'+(i+1)+'. '+escapeHTML(x.name)+'</div><div class="rank-track"><div class="rank-fill" style="width:'+Math.max(1,100*(Number(x[key])||0)/max)+'%"></div></div><div class="rank-value">'+escapeHTML(fmt(x[key]))+'</div></div>').join(''):'<p class="small">Chưa có dữ liệu phù hợp.</p>'};
async function dashboard(){
 const d=await api('/overview'),s=d.stats;
 const cards=[['Khách đã tạo đơn',s.bookingCustomers],['Tổng đơn đặt sân',s.orders],['Đơn xác nhận',s.confirmed],['Lượt đặt (khung giờ)',s.sessions],['Cơ sở thể thao',s.fields],['Doanh thu đặt sân đã trả',money(s.paidRevenue)],['Gói hội viên đã bán',s.membershipPaid],['Doanh thu hội viên',money(s.membershipRevenue)]];
 const chart=d.chart||[],max=Math.max(1,...chart.map(x=>x.count));
 const daily='<div class="bars">'+chart.map(x=>'<div class="bar" title="'+escapeHTML(x.date+': '+x.count)+'" data-count="'+escapeHTML(x.count)+'" style="height:'+Math.max(4,100*x.count/max)+'%"></div>').join('')+'</div><div class="axis"><span>'+escapeHTML(chart[0]?.date||'Chưa có dữ liệu')+'</span><span>'+escapeHTML(chart.at(-1)?.date||'')+'</span></div>';
 el('content').innerHTML='<div class="cards">'+cards.map(([name,val])=>'<div class="card"><label>'+escapeHTML(name)+'</label><strong>'+escapeHTML(val)+'</strong></div>').join('')+'</div><div class="analytics-grid"><div class="panel"><h3>Lượt đặt theo ngày</h3>'+daily+'</div><div class="panel"><h3>Top 10 sân doanh thu đặt sân cao nhất</h3>'+ranking((d.topRevenue||[]).filter(x=>x.revenue>0),'revenue',money)+'</div><div class="panel"><h3>Top 10 sân nhiều khung giờ được đặt nhất</h3>'+ranking((d.topBookings||[]).filter(x=>x.bookings>0),'bookings',x=>x+' lượt')+'</div><div class="panel"><h3>Lượt đặt theo bộ môn</h3>'+ranking(d.bySport||[],'count',x=>x+' lượt')+'</div></div><p class="small">Doanh thu sân: chỉ cộng đơn paymentStatus = paid (không gồm gói hội viên). Lượt đặt: khung giờ thuộc đơn confirmed; chưa trừ các khung đã huỷ riêng trong đơn. Doanh thu hội viên tính riêng từ đơn mua hội viên đã trả.</p>';
}
async function bookingView(){const j=await api('/bookings');bookings=j.bookings;el('content').innerHTML='<div class="panel"><div class="toolbar"><input class="search" id="bookingSearch" placeholder="Tìm mã đơn, khách, sân, ngày..."><span class="small">Hiển thị tối đa 400 đơn mới nhất</span></div><div class="tablewrap"><table><thead><tr><th>Mã đơn</th><th>Khách (UID)</th><th>Sân</th><th>Ngày & khung giờ</th><th>Thanh toán</th><th>Trạng thái</th></tr></thead><tbody id="bookingBody"></tbody></table></div></div>';el('bookingSearch').oninput=drawBookings;drawBookings()}
function drawBookings(){let q=(el('bookingSearch').value||'').toLowerCase();let found=bookings.filter(b=>JSON.stringify([b.id,b.userId,b.fieldId,b.date,b.selections]).toLowerCase().includes(q));el('bookingBody').innerHTML=found.map(b=>{let ss=Array.isArray(b.selections)&&b.selections.length?b.selections:[b];return '<tr><td><b>'+escapeHTML(b.id)+'</b><div class="small">'+escapeHTML(b.bookingType||'standard')+'</div></td><td>'+escapeHTML(b.userId||'-')+'</td><td>'+escapeHTML(b.fieldId||'-')+'</td><td>'+ss.map(x=>escapeHTML([x.date,x.courtId,x.startTime].filter(Boolean).join(' • '))).join('<br>')+'</td><td>'+escapeHTML(b.paymentStatus||'-')+'<div class="small">'+escapeHTML(money(b.totalPrice))+'</div></td><td><span class="pill '+(b.status==='confirmed'?'':'warn')+'">'+escapeHTML(b.status||'-')+'</span></td></tr>'}).join('')||'<tr><td colspan="6">Không tìm thấy đơn</td></tr>'}
async function fieldView(){let j=await api('/fields');fields=j.fields;el('content').innerHTML='<div class="panel"><div class="toolbar"><input class="search" id="fieldSearch" placeholder="Tìm tên sân, bộ môn, địa chỉ"><button class="btn yellow" id="addField">+ Thêm sân mới</button></div><div class="tablewrap"><table><thead><tr><th>Cơ sở</th><th>Bộ môn</th><th>Giá/giờ</th><th>Sân con</th><th>Giờ hoạt động</th><th>Thao tác</th></tr></thead><tbody id="fieldsBody"></tbody></table></div></div>';el('fieldSearch').oninput=drawFields;el('addField').onclick=()=>editField();drawFields()}
function drawFields(){const q=(el('fieldSearch').value||'').toLowerCase();el('fieldsBody').innerHTML=fields.map((f,i)=>({...f,_i:i})).filter(f=>[f.name,f.address,f.sport].join(' ').toLowerCase().includes(q)).map(f=>'<tr><td><b>'+escapeHTML(f.name)+'</b><div class="small">'+escapeHTML(f.address)+'</div></td><td>'+escapeHTML(f.sport)+'</td><td>'+money(f.price)+'</td><td>'+escapeHTML(f.courtCount||1)+'</td><td>'+escapeHTML(f.openingTime||'06:00')+' – '+escapeHTML(f.closingTime||'22:00')+'</td><td><button class="btn alt" data-edit="'+f._i+'">Sửa</button></td></tr>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editField(fields[Number(b.dataset.edit)]))}
function editField(f){
 el('modalTitle').textContent=f?'Sửa thông tin sân':'Thêm sân mới';
 const form=el('fieldForm');form.reset();
 const defaults={courtCount:1,openingTime:'06:00',closingTime:'22:00',sport:'Bóng đá',price:100000,rating:0};
 for(const key of ['id','name','address','sport','price','courtCount','openingTime','closingTime','rating','imageUrl','latitude','longitude','phone','googleMapsUrl']){
   form.elements[key].value=f?.[key]??defaults[key]??'';
 }
 form.elements['images'].value=(f?.images||[]).join('\n');
 form.elements['facilities'].value=(f?.facilities||[]).join('\n');
 form.elements['isPopular'].checked=f?.isPopular===true;

const enc=x=>escapeHTML(x??'');
function editor(title,fields,record,save){
 const container=el('adminEditor');
 container.innerHTML='<div class="editpanel"><h3>'+enc(title)+'</h3><form id="genericForm"><div class="formgrid">'+fields.map(f=>{
 const value=record?.[f.key]??f.def??'';
 if(f.type==='checkbox')return '<label><input type="checkbox" name="'+f.key+'" '+(value!==false?'checked':'')+'> '+enc(f.label)+'</label>';
 return '<label class="'+(f.wide?'wide':'')+'">'+enc(f.label)+(f.type==='textarea'?'<textarea name="'+f.key+'" rows="3" '+(f.required?'required':'')+'>'+enc(value)+'</textarea>':'<input name="'+f.key+'" type="'+(f.type||'text')+'" value="'+enc(value)+'" '+(f.required?'required':'')+' '+(f.type==='number'?'min="0"':'')+'>')+'</label>'
 }).join('')+'</div><div class="actions"><button type="button" class="btn alt" id="cancelEditor">Huỷ</button><button class="btn" type="submit">Lưu</button></div></form></div>';
 el('cancelEditor').onclick=()=>container.innerHTML='';
 el('genericForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());for(const f of fields)if(f.type==='checkbox')data[f.key]=e.target.elements[f.key].checked;
 const btn=e.submitter;btn.disabled=true;try{await save(data);toast('Đã lưu thành công')}catch(err){toast(err.message)}finally{btn.disabled=false}};
 container.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function reportsView(){
 const d=await api('/reports'),rows=d.monthly||[];
 const bookingTotal=rows.reduce((s,x)=>s+(Number(x.booking)||0),0),memberTotal=rows.reduce((s,x)=>s+(Number(x.membership)||0),0),total=bookingTotal+memberTotal;
 const max=Math.max(1,...rows.flatMap(x=>[Number(x.booking)||0,Number(x.membership)||0]));
 const monthly=rows.length?'<div class="report-month-chart">'+rows.map(x=>'<div class="report-month"><div class="report-bars"><div class="report-col report-booking" style="height:'+Math.max(3,100*(Number(x.booking)||0)/max)+'%" title="Đặt sân '+enc(x.month)+': '+money(x.booking)+'"></div><div class="report-col report-member" style="height:'+Math.max(3,100*(Number(x.membership)||0)/max)+'%" title="Hội viên '+enc(x.month)+': '+money(x.membership)+'"></div></div><span>'+enc(x.month)+'</span></div>').join('')+'</div>':'<p class="small">Chưa có doanh thu để hiển thị.</p>';
 const bookingPct=total>0?bookingTotal/total*100:0,memberPct=total>0?memberTotal/total*100:0;
 const share=total>0?'<div class="report-donut" style="background:conic-gradient(var(--navy) 0% '+bookingPct+'%,var(--violet) '+bookingPct+'% 100%)"><div><strong>'+money(total)+'</strong><span>Tổng doanh thu</span></div></div>':'<p class="small">Chưa có doanh thu để hiển thị.</p>';
 el('content').innerHTML='<div class="panel"><div class="toolbar"><b>Doanh thu theo tháng</b><button class="btn alt" id="exportReport">Xuất CSV</button></div>'+tabular(['Tháng','Doanh thu đặt sân','Doanh thu hội viên','Tổng'],rows.map(x=>[enc(x.month),money(x.booking),money(x.membership),money(x.booking+x.membership)]))+'</div><div class="analytics-grid"><div class="panel"><h3>Doanh thu theo tháng và nguồn</h3>'+monthly+'<div class="report-legend"><span><i class="report-dot" style="background:var(--navy)"></i> Đặt sân</span><span><i class="report-dot" style="background:var(--violet)"></i> Hội viên</span></div></div><div class="panel"><h3>Cơ cấu doanh thu</h3>'+share+'<div class="report-breakdown"><div><span><i class="report-dot" style="background:var(--navy)"></i> Đặt sân</span><b>'+money(bookingTotal)+' · '+bookingPct.toFixed(1)+'%</b></div><div><span><i class="report-dot" style="background:var(--violet)"></i> Hội viên</span><b>'+money(memberTotal)+' · '+memberPct.toFixed(1)+'%</b></div></div></div></div><p class="small">Doanh thu cộng từ đơn đã ghi nhận thanh toán, chưa khấu trừ hoàn tiền hay chi phí.</p>';
 el('exportReport').onclick=()=>{const lines=[['Tháng','Đặt sân VND','Hội viên VND','Tổng VND'],...rows.map(x=>[x.month,x.booking,x.membership,x.booking+x.membership])];const data='\ufeff'+lines.map(x=>x.join(',')).join('\r\n');const blob=new Blob([data],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='sporty-doanh-thu.csv';a.click();URL.revokeObjectURL(u)};
}
